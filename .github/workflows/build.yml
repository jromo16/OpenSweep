name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publicar ejecutable único
        working-directory: windows/OpenSweep
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o ../../dist
      - name: Renombrar
        run: Rename-Item dist/OpenSweep.exe OpenSweep-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSweep-windows
          path: dist/OpenSweep-windows.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar plataforma Android 37
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk OpenSweep-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSweep-android
          path: OpenSweep-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenSweep-windows.exe
            OpenSweep-android.apk
          generate_release_notes: true
